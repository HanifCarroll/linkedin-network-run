<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach Review Queue</title>
<style>
  :root {
    --bg: #F5F4F1;
    --ink: #1B1A17;
    --ink-2: #56544E;
    --ink-3: #8E8C84;
    --ink-4: #BDBBB2;
    --line: #E3E1D9;
    --line-soft: #ECE9E1;
    --accent: #0A66C2;
    --accent-ink: #075093;
    --accent-soft: #EAF2FA;
    --ok: #1F7A3D;
    --ok-soft: #EAF4ED;
    --warn: #8A5A00;
    --warn-soft: #FAF1E3;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: flex-end;
    gap: var(--s5);
    padding: var(--s5) var(--s6) var(--s3);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .brand h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  .brand .sub { margin: 2px 0 0; color: var(--ink-3); font-size: 14px; }
  .controls { display: flex; align-items: center; gap: var(--s3); margin-left: auto; flex-wrap: wrap; }

  input[type="search"] {
    background: #fff; border: 1px solid var(--line); border-radius: var(--s2);
    padding: 7px 12px; font: inherit; font-size: 15px; color: var(--ink);
    width: 240px; outline: none;
  }
  input[type="search"]::placeholder { color: var(--ink-4); }
  input[type="search"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .switch { display: inline-flex; align-items: center; gap: var(--s2); color: var(--ink-2); font-size: 15px; cursor: pointer; user-select: none; }
  .switch input {
    appearance: none; width: 34px; height: 20px; margin: 0; border: 0; border-radius: 999px;
    background: var(--line); position: relative; cursor: pointer; transition: background 0.15s;
  }
  .switch input::after {
    content: ""; position: absolute; width: 14px; height: 14px; top: 3px; left: 3px;
    border-radius: 50%; background: #fff; transition: transform 0.15s;
  }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(14px); }
  .switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .filters { display: flex; gap: var(--s1); padding: var(--s3) var(--s6) var(--s3); border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  .filter {
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .filter .n { font-family: var(--mono); font-weight: 500; color: var(--ink-3); }
  .filter:hover { border-color: var(--ink-4); }
  .filter.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .filter.active .n { color: rgba(255,255,255,0.7); }
  .filter.clear { margin-left: auto; color: var(--accent); border-color: var(--accent); }
  .filter.clear:hover { background: var(--accent-soft); }

  .sections { display: flex; gap: var(--s1); padding: var(--s3) var(--s6) 0; flex-wrap: wrap; align-items: center; }
  .section-btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink-2);
    border-radius: var(--s2); padding: 8px 14px; font: inherit; font-size: 15px; font-weight: 650;
    cursor: pointer; display: inline-flex; align-items: center; gap: var(--s2);
  }
  .section-btn .n { font-family: var(--mono); font-weight: 500; color: var(--ink-3); }
  .section-btn:hover { border-color: var(--ink-4); }
  .section-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .section-btn.active .n { color: rgba(255,255,255,0.7); }

  .reminder { margin-top: var(--s4); background: var(--warn-soft); border: 1px solid #EAD9A8; border-radius: var(--s2); padding: var(--s3) var(--s4); color: var(--warn); font-size: 15px; line-height: 1.5; }
  .reminder strong { display: block; font-weight: 650; }

  .role-url { color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 500; }
  .role-url:hover { color: var(--accent-ink); text-decoration: underline; }

  main { flex: 1; display: grid; grid-template-columns: minmax(360px, 5fr) 7fr; min-height: 0; }
  .list { overflow-y: auto; border-right: 1px solid var(--line); }
  .detail { overflow-y: auto; }

  .row {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s3) var(--s4);
    border-bottom: 1px solid var(--line-soft);
    cursor: pointer;
  }
  .row:hover { background: rgba(0, 0, 0, 0.025); }
  .row.selected { background: var(--accent-soft); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row-main { flex: 1; min-width: 0; }
  .row-name { font-weight: 650; color: var(--ink); font-size: 16px; }
  .row-company { font-weight: 600; color: var(--ink); font-size: 16px; }
  .row-company .loc { font-weight: 400; color: var(--ink-3); }
  .row-title { color: var(--ink-2); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-class { color: var(--ink-3); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-side { display: flex; gap: var(--s2); align-items: center; flex: none; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    padding: 1px 7px; border-radius: 999px; line-height: 1.5; letter-spacing: 0.01em;
  }
  .badge.d1 { background: var(--accent); color: #fff; }
  .badge.d2 { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .badge.d3 { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
  .badge.count { background: var(--line-soft); color: var(--ink-2); box-shadow: none; }
  .badge.rev { background: var(--line-soft); color: var(--ink-2); box-shadow: none; }
  .badge.rev.needs_review { background: var(--line-soft); color: var(--ink-3); }
  .badge.rev.approved { color: var(--accent); background: var(--accent-soft); }
  .badge.rev.skipped { color: var(--warn); background: var(--warn-soft); }
  .badge.rev.sent { color: var(--ok); background: var(--ok-soft); }
  .badge.triage { color: var(--ink-2); background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
  .badge.dup { color: var(--warn); background: var(--warn-soft); }
  .badge.kind-direct { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .badge.kind-applied { background: var(--ok-soft); color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok); }

  .detail { padding: var(--s5) var(--s6) var(--s6); }
  .detail-head h2 { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; margin: var(--s3) 0 var(--s1); line-height: 1.25; }
  .detail-head .company { font-size: 17px; font-weight: 600; }
  .detail-head .loc { color: var(--ink-3); font-size: 15px; margin-top: 2px; }
  .detail-head .open { display: inline-flex; margin-top: var(--s3); color: var(--accent); text-decoration: none; font-weight: 500; }
  .detail-head .open:hover { color: var(--accent-ink); text-decoration: underline; }

  .status { display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; padding: 2px 10px; border-radius: 999px; color: var(--ink-3); background: var(--line-soft); }
  .status.approved { color: var(--accent); background: var(--accent-soft); }
  .status.skipped { color: var(--warn); background: var(--warn-soft); }
  .status.sent { color: var(--ok); background: var(--ok-soft); }

  .facts { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); align-items: center; }
  .fact { display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; padding: 2px 10px; border-radius: 999px; color: var(--ink-2); background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  .fact.flag { color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .fact.muted { color: var(--ink-3); background: transparent; box-shadow: none; padding: 0 2px; font-weight: 500; }

  .description { margin-top: var(--s5); }
  .description h3 { font-size: 14px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 0 0 var(--s3); }
  .description .body { font-size: 16px; line-height: 1.55; color: var(--ink); }
  .description .body div { margin: 0 0 3px; }
  .description .body .desc-heading { font-weight: 650; margin-top: var(--s4); color: var(--ink); }
  .description .body .desc-heading:first-child { margin-top: 0; }

  .summary { margin-top: var(--s5); }
  .summary h3 { font-size: 14px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 0 0 var(--s3); }
  .summary .block { font-size: 16px; line-height: 1.55; color: var(--ink); margin: 0 0 var(--s3); }
  .summary .block:last-child { margin-bottom: 0; }
  .summary .label { font-size: 14px; font-weight: 650; color: var(--ink-2); margin-bottom: 1px; }
  .summary ul { margin: 2px 0 0 18px; padding: 0; }
  .summary li { margin: 1px 0; }

  .benefits { margin-top: var(--s4); }
  .benefits h3 { font-size: 14px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 0 0 var(--s2); }
  .benefits .list { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .benefit { font-size: 14px; color: var(--ink-2); background: var(--line-soft); border-radius: 6px; padding: 3px 9px; }

  .team { margin-top: var(--s5); }
  .team h3 { font-size: 14px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 0 0 var(--s3); }
  .team h3 .count { font-family: var(--mono); color: var(--ink-3); font-weight: 500; }
  .team ul { list-style: none; margin: 0; padding: 0; }
  .team li { display: flex; gap: var(--s3); padding: var(--s3) 0; align-items: flex-start; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center;
    font-weight: 650; font-size: 14px; flex: none;
  }
  .member { flex: 1; min-width: 0; }
  .member .name { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .member .name a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .member .name a:hover { color: var(--accent); text-decoration: underline; }
  .member .headline { color: var(--ink-2); font-size: 15px; margin-top: 1px; }

  .team .roles { list-style: none; margin: 0; padding: 0; }
  .team .roles li { display: block; padding: var(--s3) var(--s2); cursor: pointer; border-radius: var(--s2); }
  .team .roles li:hover { background: rgba(0, 0, 0, 0.03); }
  .team .roles li:hover .role-title { color: var(--accent); }
  .team .roles li.current { background: var(--accent-soft); }
  .team .roles li:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .team .role-title { font-weight: 600; color: var(--ink); }
  .team .role-company { color: var(--ink-2); font-size: 15px; }
  .team .role-company .loc { color: var(--ink-3); }
  .team .role-state { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; margin-top: 3px; }
  .team .role-owner { color: var(--ink-3); font-size: 13px; }

  .draft { margin-top: var(--s5); }
  .detail.hide-draft .draft { display: none; }
  .draft h3 { font-size: 14px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 0 0 var(--s3); }
  .draft label { display: block; font-size: 14px; font-weight: 650; color: var(--ink-2); margin: var(--s3) 0 4px; }
  .draft input[type="text"], .draft textarea {
    width: 100%; background: #fff; border: 1px solid var(--line); border-radius: var(--s2);
    padding: 8px 10px; font: inherit; font-size: 16px; color: var(--ink); outline: none; resize: vertical;
  }
  .draft input[type="text"]:focus, .draft textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .draft textarea { min-height: 200px; line-height: 1.55; white-space: pre-wrap; }
  .draft-actions { display: flex; gap: var(--s2); margin-top: var(--s3); flex-wrap: wrap; }
  .draft-actions button {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: var(--s2); padding: 7px 14px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .draft-actions button:hover { border-color: var(--ink-4); }
  .draft-actions button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .draft-actions button.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  .draft-actions button.danger { color: #B3261E; border-color: #E5C6C4; }
  .draft-hint { margin-top: var(--s2); color: var(--ink-4); font-size: 14px; }
  .draft-read { background: #fff; border: 1px solid var(--line-soft); border-radius: var(--s2); padding: var(--s3); white-space: pre-wrap; font-size: 16px; line-height: 1.55; color: var(--ink); }
  .draft-subject-read { font-weight: 600; margin-bottom: var(--s2); }
  .flash { position: fixed; right: var(--s4); bottom: var(--s4); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: var(--s2); font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .flash.show { opacity: 1; }

  .meta { margin-top: var(--s5); padding-top: var(--s3); border-top: 1px solid var(--line); color: var(--ink-4); font-size: 14px; }
  .meta .mono { font-family: var(--mono); }

  .empty { padding: var(--s6) var(--s4); color: var(--ink-3); text-align: center; font-size: 15px; }
  .error { padding: var(--s6) var(--s4); color: #B3261E; text-align: center; font-size: 15px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Outreach Review Queue</h1>
    <p class="sub" id="summary">Loading…</p>
  </div>
  <div class="controls">
    <label class="switch"><input type="checkbox" id="showDraft" role="switch" checked> Show draft</label>
    <input type="search" id="search" placeholder="Filter name, role, company, location, doing…" autocomplete="off">
  </div>
</header>
<div class="sections" id="sections"></div>
<div class="filters" id="filters"></div>
<main>
  <section class="list" id="list"></section>
  <section class="detail" id="detail"><div class="empty">Select an opportunity to review</div></section>
</main>
<div class="flash" id="flash"></div>
<script type="module">
  import { groupJobs, bucketFor, primaryRoleFor, messageOwnerId, draftActionFor, groupOutreachKind, outreachKindLabel, sectionCounts, showsApplicationReminder, visibleGroups } from "/groups.js";

  const DEGREE_TITLE = { "1st": "1st-degree connection", "2nd": "2nd-degree connection", "3rd": "3rd-degree connection" };
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const SECTION_LABELS = { all: "All outreach", direct: "Direct outreach", application_followup: "Application follow-up" };
  const SECTIONS = ["all", "direct", "application_followup"];
  const FILTERS = [
    { key: "needs_review", label: "Pending" },
    { key: "approved", label: "Approved" },
    { key: "skipped", label: "Rejected" },
    { key: "sent", label: "Sent" },
    { key: "all", label: "All" },
  ];
  const state = { jobs: [], groups: [], section: "direct", filter: "needs_review", query: "", selectedKey: null, override: new Map() };

  function refreshGroups() { state.groups = groupJobs(state.jobs); }
  function selectedGroup() { return state.groups.find((g) => g.key === state.selectedKey) ?? null; }
  function primaryOf(group) { return primaryRoleFor(group.jobs, state.override.get(group.key)); }
  function groupKind(group) { return groupOutreachKind(group.jobs); }
  function sectionGroups() {
    return state.section === "all"
      ? state.groups
      : state.groups.filter((g) => groupKind(g) === state.section);
  }
  function recipientName(group) {
    const primary = primaryOf(group);
    return String((primary.hiringTeam || [])[0]?.name ?? "").trim();
  }

  function sectionCountsAll() {
    const c = sectionCounts(state.groups);
    c.all = state.groups.length;
    return c;
  }

  function counts() {
    const c = { needs_review: 0, approved: 0, skipped: 0, sent: 0, all: 0 };
    const groups = sectionGroups();
    for (const g of groups) c[bucketFor(g.jobs)] += 1;
    c.all = groups.length;
    return c;
  }

  function visible() { return visibleGroups(state.groups, state.section, state.filter, state.query); }

  function defaultsActive() {
    return state.query === "" && state.filter === "needs_review" && state.section === "direct";
  }

  function badge(deg) {
    if (!deg) return "";
    return `<span class="badge d${deg[0]}" title="${DEGREE_TITLE[deg] || ""}">${esc(deg)}</span>`;
  }

  function triageBadge(job) {
    const label = { strong: "Strong fit", possible: "Possible fit", weak: "Weak fit" }[job.triageBucket];
    return label ? `<span class="badge triage">${label}</span>` : "";
  }

  function reviewBadge(bucket) {
    if (bucket === "needs_review") return `<span class="badge rev needs_review">Pending</span>`;
    const label = { approved: "Approved", skipped: "Rejected", sent: "Sent" }[bucket];
    return `<span class="badge rev ${bucket}">${label}</span>`;
  }

  function classLine(job) {
    return [job.workFocus ? `Doing: ${job.workFocus}` : "", job.productSystem ? `Building: ${job.productSystem}` : ""]
      .filter(Boolean).join(" · ");
  }

  function roleStateLabel(role) {
    if (role.status === "sent") return { bucket: "sent", label: "Sent", note: "message sent for this role" };
    if (role.review === "approved") return { bucket: "approved", label: "Approved", note: "owns the approved message" };
    if (role.review === "skipped") return { bucket: "skipped", label: "Rejected", note: "" };
    return { bucket: "needs_review", label: "Pending", note: "" };
  }

  function renderDescription(text) {
    const connectors = new Set(["of", "the", "and", "in", "for", "to", "with", "a", "an", "on", "at", "&"]);
    const isHeading = (line) => {
      const t = line.trim();
      if (!t || t.length > 48) return false;
      if (/[.,;:|]$/.test(t) || /[•·()]/.test(t)) return false;
      const words = t.split(/\s+/).filter(Boolean);
      return words.length > 0 && words.every((w) => /^[A-Z0-9]/.test(w) || connectors.has(w.toLowerCase()));
    };
    return text.split("\n").filter((l) => l.trim()).map((line) => {
      const t = line.trim();
      return isHeading(t) ? `<div class="desc-heading">${esc(t)}</div>` : `<div>${esc(t)}</div>`;
    }).join("");
  }

  function renderSections() {
    const c = sectionCountsAll();
    el("sections").innerHTML = SECTIONS.map((k) =>
      `<button class="section-btn${state.section === k ? " active" : ""}" data-section="${k}">${SECTION_LABELS[k]} <span class="n">${c[k]}</span></button>`
    ).join("");
  }

  function renderFilters() {
    const c = counts();
    const clear = defaultsActive()
      ? ""
      : `<button class="filter clear" data-clear type="button">Clear</button>`;
    el("filters").innerHTML = FILTERS.map((f) =>
      `<button class="filter${state.filter === f.key ? " active" : ""}" data-filter="${f.key}">${f.label} <span class="n">${c[f.key]}</span></button>`
    ).join("") + clear;
  }

  function renderList() {
    const list = el("list");
    const groups = visible();
    if (!groups.length) {
      const message = sectionGroups().length === 0
        ? `No people in ${SECTION_LABELS[state.section]} yet`
        : "No people match your search or filters";
      list.innerHTML = `<div class="empty">${esc(message)}</div>`;
      return;
    }
    list.innerHTML = groups.map((group) => {
      const primary = primaryOf(group);
      const bucket = bucketFor(group.jobs);
      const kind = groupKind(group);
      const name = recipientName(group);
      const displayName = name || primary.title || "—";
      const roles = group.jobs.length;
      const side = [
        state.section === "all"
          ? `<span class="badge kind ${kind === "direct" ? "kind-direct" : "kind-applied"}">${esc(outreachKindLabel(kind))}</span>`
          : "",
        roles > 1 ? `<span class="badge dup" title="${roles} roles list this person">${roles} roles</span>` : "",
        triageBadge(primary),
        reviewBadge(bucket),
      ].join("");
      const sel = group.key === state.selectedKey ? " selected" : "";
      const cl = classLine(primary);
      return `<div class="row${sel}" data-key="${esc(group.key)}" role="button" tabindex="0">
        <div class="row-main">
          <div class="row-name">${esc(displayName)}</div>
          <div class="row-title">${esc(primary.title || "—")}${primary.company ? ` · ${esc(primary.company)}` : ""}</div>
          ${cl ? `<div class="row-class">${esc(cl)}</div>` : ""}
        </div>
        <div class="row-side">${side}</div>
      </div>`;
    }).join("");
  }

  function roleChip(role, primaryId, ownerId) {
    const st = roleStateLabel(role);
    const current = role.id === primaryId;
    return `<li data-select-job="${esc(role.id)}" role="button" tabindex="0"${current ? ' class="current"' : ""}>
      <div class="role-title">${esc(role.title || "—")}${current ? ' <span class="badge rev">Primary</span>' : ""}</div>
      <div class="role-company">${esc(role.company || "—")}${role.location ? `<span class="loc"> · ${esc(role.location)}</span>` : ""}</div>
      <div class="role-state"><span class="badge rev ${st.bucket}">${st.label}</span>${role.id === ownerId ? ` <span class="role-owner">${esc(st.note)}</span>` : ""}</div>
      <a class="role-url" href="${esc(role.postingUrl)}" target="_blank" rel="noopener">View posting ↗</a>
    </li>`;
  }

  function renderDetail() {
    const d = el("detail");
    const group = selectedGroup();
    if (!group) { d.innerHTML = `<div class="empty">Select an opportunity to review</div>`; return; }
    const primary = primaryOf(group);
    const bucket = bucketFor(group.jobs);
    const name = recipientName(group);
    const displayName = name || primary.title || "—";
    const first = (primary.hiringTeam || [])[0];
    const ownerId = messageOwnerId(group.jobs);
    const action = draftActionFor(group.jobs, primary.id);
    const rolesHtml = `<div class="team"><h3>Roles for this person <span class="count">${group.jobs.length}</span></h3><ul class="roles">${group.jobs.map((role) => roleChip(role, primary.id, ownerId)).join("")}</ul></div>`;
    const facts = [
      primary.workFocus ? `<span class="fact">Doing: ${esc(primary.workFocus)}</span>` : "",
      primary.productSystem ? `<span class="fact">Building: ${esc(primary.productSystem)}</span>` : "",
      primary.workplaceType ? `<span class="fact">${esc(primary.workplaceType)}</span>` : "",
      primary.employmentType ? `<span class="fact">${esc(primary.employmentType)}</span>` : "",
      primary.matchedTerm ? `<span class="fact flag">Matched: ${esc(primary.matchedTerm)}</span>` : "",
      primary.filterReason ? `<span class="fact muted">${esc(primary.filterReason)}</span>` : "",
      primary.applyMethod ? `<span class="fact">${esc(primary.applyMethod)}</span>` : "",
      primary.promoted ? `<span class="fact flag">Promoted</span>` : "",
      primary.activelyReviewing ? `<span class="fact flag">Actively reviewing</span>` : "",
      primary.postedAt ? `<span class="fact muted">${esc(primary.postedAt)}</span>` : "",
      primary.applicantCount ? `<span class="fact muted">${esc(primary.applicantCount)}</span>` : "",
    ].filter(Boolean).join("");
    const benefits = primary.benefits || [];
    const descHtml = primary.description
      ? `<div class="description"><h3>About the job</h3><div class="body">${renderDescription(primary.description)}</div></div>`
      : "";
    const summaryBlocks = [
      primary.productSummary ? `<div class="block"><div class="label">What you'd build</div>${esc(primary.productSummary)}</div>` : "",
    ].filter(Boolean).join("");
    const fitBrief = `<div class="summary"><h3>Fit brief</h3>
      <div class="block"><div class="label">Company</div>${esc(primary.companySummary || primary.company || "Unknown")}</div>
      <div class="block"><div class="label">What you'd work on</div>${esc(primary.workSummary)}</div>
      <div class="block"><div class="label">Responsibilities</div>${primary.responsibilities.length ? `<ul>${primary.responsibilities.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>` : "Unknown"}</div>
      <div class="block"><div class="label">Skill match</div>${primary.skillMatches.length ? `<ul>${primary.skillMatches.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>` : "Unknown"}</div>
      <div class="block"><div class="label">Gaps</div>${primary.skillGaps.length ? `<ul>${primary.skillGaps.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>` : "Unknown"}</div>
    </div>`;
    const summaryHtml = summaryBlocks ? `<div class="summary"><h3>Summary</h3>${summaryBlocks}</div>` : "";
    const benefitsHtml = benefits.length
      ? `<div class="benefits"><h3>Benefits</h3><div class="list">${benefits.map((b) => `<span class="benefit">${esc(b)}</span>`).join("")}</div></div>`
      : "";
    const statusLabel = { needs_review: "pending", approved: "approved", skipped: "rejected", sent: "sent" }[bucket];
    const reminderHtml = showsApplicationReminder(group.jobs)
      ? `<div class="reminder"><strong>Apply first, then send this application note the same day or next day.</strong> Keep it brief: name the role and company, include one specific relevant proof, and don't ask for a call. No message is sent from this page.</div>`
      : "";
    const draftHtml = action.editable
      ? `<div class="draft">
          <h3>Draft message</h3>
          <label for="draft-subject">Subject</label>
          <input type="text" id="draft-subject" placeholder="(optional — only used when the composer shows a subject field)" value="${esc(primary.subject ?? "")}">
          <label for="draft-body">Body</label>
          <textarea id="draft-body" spellcheck="true">${esc(primary.message ?? "")}</textarea>
          <div class="draft-actions">
            <button data-action="save">Save</button>
            <button data-action="approve" class="primary">${action.replace ? "Use this draft instead" : "Approve &amp; next"}</button>
            <button data-action="skip">Reject &amp; next</button>
          </div>
          <div class="draft-hint">Blank lines between paragraphs are preserved. No message is sent from this page.</div>
        </div>`
      : `<div class="draft">
          <h3>Draft message</h3>
          ${primary.subject ? `<div class="draft-subject-read">${esc(primary.subject)}</div>` : ""}
          <div class="draft-read">${esc(primary.message ?? "")}</div>
          ${action.canReturn
            ? `<div class="draft-actions"><button data-action="return">Return to review</button></div>`
            : ""}
        </div>`;
    d.innerHTML = `
      <div class="detail-head">
        <span class="status ${bucket}">${statusLabel}</span> ${triageBadge(primary)}
        <h2>${esc(displayName)} ${badge(first?.degree)}</h2>
        <div class="company">${esc(primary.title || "—")}${primary.company ? ` · ${esc(primary.company)}` : ""}</div>
        ${primary.location ? `<div class="loc">${esc(primary.location)}</div>` : ""}
        ${first?.profileUrl ? `<div class="loc"><a class="role-url" href="${esc(first.profileUrl)}" target="_blank" rel="noopener">Hiring profile ↗</a></div>` : ""}
        ${first?.headline ? `<div class="loc">${esc(first.headline)}</div>` : ""}
        ${facts ? `<div class="facts">${facts}</div>` : ""}
        <div><a class="open" href="${esc(primary.postingUrl)}" target="_blank" rel="noopener">Open posting ↗</a></div>
      </div>
      ${rolesHtml}
      ${fitBrief}
      ${reminderHtml}
      ${draftHtml}
      ${summaryHtml}
      ${descHtml}
      ${benefitsHtml}
      ${(primary.evidenceGaps?.length ?? 0) ? `<div class="meta">Evidence gaps: ${primary.evidenceGaps.map(esc).join(", ")}</div>` : ""}
      <div class="meta">ID <span class="mono">${esc(primary.id)}</span> · captured ${esc((primary.collectedAt || "").slice(0, 10))}</div>`;
  }

  function renderSummary() {
    const c = counts();
    el("summary").textContent = `${SECTION_LABELS[state.section]} — ${c.needs_review} pending · ${c.approved} approved · ${c.skipped} rejected · ${c.sent} sent`;
  }

  function renderAll() { renderSummary(); renderSections(); renderFilters(); renderList(); renderDetail(); }

  function flash(message) {
    const f = el("flash");
    f.textContent = message;
    f.classList.add("show");
    setTimeout(() => f.classList.remove("show"), 2200);
  }

  function flashError(message) {
    const f = el("flash");
    f.textContent = message;
    f.style.background = "#B3261E";
    f.classList.add("show");
    setTimeout(() => { f.classList.remove("show"); f.style.background = ""; }, 3200);
  }

  async function post(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const payload = await res.json().catch(() => ({}));
    if (!res.ok || payload.ok !== true) {
      const err = payload?.error ?? {};
      const error = new Error(err.message ?? "request failed");
      error.code = err.code ?? "ERROR";
      if (err.details) error.details = err.details;
      throw error;
    }
    return payload.data;
  }

  async function loadJobs() {
    const res = await fetch("/jobs.json");
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const payload = await res.json();
    state.jobs = Array.isArray(payload) ? payload : (payload?.data ?? []);
    refreshGroups();
    if (state.selectedKey !== null && !state.groups.some((g) => g.key === state.selectedKey)) {
      state.selectedKey = null;
    }
  }

  function subjVal() { return el("draft-subject").value; }
  function bodyVal() { return el("draft-body").value; }
  function currentPrimaryId() { const g = selectedGroup(); return g ? primaryOf(g).id : null; }

  async function saveDraft() {
    const jobId = currentPrimaryId();
    if (!jobId) return;
    try {
      const data = await post(`/api/jobs/${encodeURIComponent(jobId)}/draft`, { subject: subjVal(), message: bodyVal() });
      state.jobs = state.jobs.map((j) => (j.id === jobId ? data : j));
      refreshGroups();
      renderAll();
      flash("Saved");
    } catch (e) { flashError(e.message); }
  }

  async function approve() {
    const jobId = currentPrimaryId();
    if (!jobId) return;
    let saved = null;
    try {
      if (bodyVal().trim()) {
        saved = await post(`/api/jobs/${encodeURIComponent(jobId)}/draft`, { subject: subjVal(), message: bodyVal() });
        state.jobs = state.jobs.map((j) => (j.id === jobId ? saved : j));
        refreshGroups();
        renderAll();
      }
    } catch (e) { flashError(e.message); return; }
    try {
      await post(`/api/jobs/${encodeURIComponent(jobId)}/review`, { review: "approved" });
      await loadJobs();
      advanceAfterAction();
      renderAll();
      flash("Approved");
    } catch (e) {
      const details = e.details ?? null;
      if (e.code === "DUPLICATE_APPROVED_PROFILE" && details?.status === "drafted") {
        const title = details.title ?? "the other role";
        const replace = confirm(`This person already has an approved draft for "${title}". Use this draft instead?`);
        if (replace) {
          try {
            await post(`/api/jobs/${encodeURIComponent(jobId)}/review`, { review: "approved", replaceId: details.jobId });
            await loadJobs();
            advanceAfterAction();
            renderAll();
            flash("Approved — previous approval replaced");
          } catch (e2) { flashError(e2.message); }
        } else {
          flash("Saved. Existing approval unchanged.");
        }
      } else if (e.code === "DUPLICATE_APPROVED_PROFILE" && details?.status === "sent") {
        flash(`Saved. This person was already contacted for "${details.title ?? "that role"}".`);
      } else {
        flashError(e.message);
      }
    }
  }

  async function skipPerson() {
    const jobId = currentPrimaryId();
    if (!jobId) return;
    try {
      await post(`/api/recipients/${encodeURIComponent(jobId)}/review`, { review: "skipped" });
      await loadJobs();
      advanceAfterAction();
      renderAll();
      flash("Rejected");
    } catch (e) { flashError(e.message); }
  }

  async function returnPerson() {
    const group = selectedGroup();
    const jobId = group ? primaryOf(group).id : null;
    const key = group ? group.key : null;
    if (!jobId) return;
    try {
      await post(`/api/recipients/${encodeURIComponent(jobId)}/review`, { review: "needs_review" });
      state.filter = "needs_review";
      await loadJobs();
      state.selectedKey = key;
      renderAll();
      flash("Returned to review");
    } catch (e) { flashError(e.message); }
  }

  function advanceAfterAction() {
    state.selectedKey = sectionGroups().find((g) => bucketFor(g.jobs) === "needs_review")?.key ?? null;
  }

  el("search").addEventListener("input", (e) => {
    state.query = e.target.value.trim();
    if (state.selectedKey !== null && !visible().some((g) => g.key === state.selectedKey)) {
      state.selectedKey = visible()[0]?.key ?? null;
    }
    renderFilters();
    renderList();
    renderDetail();
  });
  el("showDraft").addEventListener("change", (e) => { el("detail").classList.toggle("hide-draft", !e.target.checked); });
  el("sections").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-section]");
    if (!btn) return;
    state.section = btn.dataset.section;
    state.selectedKey = visible()[0]?.key ?? null;
    renderAll();
  });
  el("filters").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-filter]");
    if (!btn) return;
    state.filter = btn.dataset.filter;
    state.selectedKey = visible()[0]?.key ?? null;
    renderAll();
  });
  el("filters").addEventListener("click", (e) => {
    if (!e.target.closest("[data-clear]")) return;
    state.query = "";
    state.filter = "needs_review";
    state.section = "direct";
    el("search").value = "";
    state.selectedKey = visible()[0]?.key ?? null;
    renderAll();
  });
  el("list").addEventListener("click", (e) => {
    const row = e.target.closest(".row");
    if (!row) return;
    state.selectedKey = row.dataset.key;
    renderList(); renderDetail();
  });
  el("list").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const row = e.target.closest(".row");
    if (!row) return;
    e.preventDefault();
    state.selectedKey = row.dataset.key;
    renderList(); renderDetail();
  });
  el("detail").addEventListener("click", (e) => {
    if (e.target.closest("a[href]")) return;
    const role = e.target.closest("[data-select-job]");
    if (role) {
      const group = selectedGroup();
      if (group) {
        state.override.set(group.key, role.dataset.selectJob);
        renderList(); renderDetail();
      }
      return;
    }
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === "save") return saveDraft();
    if (action === "approve") return approve();
    if (action === "skip") return skipPerson();
    if (action === "return") return returnPerson();
  });
  el("detail").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const role = e.target.closest("[data-select-job]");
    if (!role) return;
    e.preventDefault();
    const group = selectedGroup();
    if (group) {
      state.override.set(group.key, role.dataset.selectJob);
      renderList(); renderDetail();
    }
  });

  loadJobs()
    .then(() => {
      state.selectedKey = sectionGroups().find((g) => bucketFor(g.jobs) === "needs_review")?.key ?? sectionGroups()[0]?.key ?? null;
      renderAll();
    })
    .catch((e) => {
      el("summary").textContent = "Failed to load";
      el("list").innerHTML = `<div class="error">Could not load people: ${esc(e.message)}</div>`;
    });
</script>
</body>
</html>
