<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Leads</title>
<style>
  :root {
    --bg: #F5F4F1;
    --ink: #1B1A17;
    --ink-2: #56544E;
    --ink-3: #8E8C84;
    --ink-4: #BDBBB2;
    --line: #E3E1D9;
    --line-soft: #ECE9E1;
    --accent: #0A66C2;
    --accent-ink: #075093;
    --accent-soft: #EAF2FA;
    --ok: #1F7A3D;
    --ok-soft: #EAF4ED;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: flex-end;
    gap: var(--s5);
    padding: var(--s5) var(--s6) var(--s4);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .brand h1 { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  .brand .sub { margin: 2px 0 0; color: var(--ink-3); font-size: 12.5px; }
  .controls { display: flex; align-items: center; gap: var(--s3); margin-left: auto; flex-wrap: wrap; }

  input[type="search"] {
    background: #fff; border: 1px solid var(--line); border-radius: var(--s2);
    padding: 7px 12px; font: inherit; font-size: 13px; color: var(--ink);
    width: 260px; outline: none;
  }
  input[type="search"]::placeholder { color: var(--ink-4); }
  input[type="search"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  select {
    background: #fff; border: 1px solid var(--line); border-radius: var(--s2);
    padding: 7px 10px; font: inherit; font-size: 13px; color: var(--ink);
    outline: none; cursor: pointer;
  }

  main { flex: 1; display: grid; grid-template-columns: minmax(380px, 5fr) 7fr; min-height: 0; }
  .list { overflow-y: auto; border-right: 1px solid var(--line); }
  .detail { overflow-y: auto; }

  .row {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s3) var(--s4);
    border-bottom: 1px solid var(--line-soft);
    cursor: pointer;
  }
  .row:hover { background: rgba(0, 0, 0, 0.025); }
  .row.selected { background: var(--accent-soft); }
  .row-main { flex: 1; min-width: 0; }
  .row-company { font-weight: 600; color: var(--ink); font-size: 13.5px; }
  .row-company .loc { font-weight: 400; color: var(--ink-3); }
  .row-title { color: var(--ink-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-side { display: flex; gap: var(--s2); align-items: center; flex: none; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    padding: 1px 7px; border-radius: 999px; line-height: 1.5; letter-spacing: 0.01em;
  }
  .badge.d1 { background: var(--accent); color: #fff; }
  .badge.d2 { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .badge.d3 { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
  .badge.count { background: var(--line-soft); color: var(--ink-2); box-shadow: none; }

  .detail { padding: var(--s5) var(--s6) var(--s6); }
  .detail-head h2 { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; margin: var(--s3) 0 var(--s1); line-height: 1.25; }
  .detail-head .company { font-size: 15px; font-weight: 600; }
  .detail-head .loc { color: var(--ink-3); font-size: 13px; margin-top: 2px; }
  .detail-head .open { display: inline-flex; margin-top: var(--s3); color: var(--accent); text-decoration: none; font-weight: 500; }
  .detail-head .open:hover { color: var(--accent-ink); text-decoration: underline; }

  .status { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; color: var(--ink-3); background: var(--line-soft); }
  .status.favorite { color: var(--accent); background: var(--accent-soft); }
  .status.drafted { color: var(--ink-2); background: var(--line-soft); }
  .status.sent { color: var(--ok); background: var(--ok-soft); }

  .facts { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); align-items: center; }
  .fact { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; color: var(--ink-2); background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  .fact.flag { color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .fact.muted { color: var(--ink-3); background: transparent; box-shadow: none; padding: 0 2px; font-weight: 500; }

  .description { margin-top: var(--s5); }
  .description h3 { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 0 0 var(--s3); }
  .description .body { font-size: 13.5px; line-height: 1.55; color: var(--ink); }
  .description .body div { margin: 0 0 3px; }
  .description .body .desc-heading { font-weight: 650; margin-top: var(--s4); color: var(--ink); }
  .description .body .desc-heading:first-child { margin-top: 0; }

  .benefits { margin-top: var(--s4); }
  .benefits h3 { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 0 0 var(--s2); }
  .benefits .list { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .benefit { font-size: 12px; color: var(--ink-2); background: var(--line-soft); border-radius: 6px; padding: 3px 9px; }

  .team { margin-top: var(--s5); }
  .team h3 { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin: 0 0 var(--s3); }
  .team h3 .count { font-family: var(--mono); color: var(--ink-3); font-weight: 500; }
  .team ul { list-style: none; margin: 0; padding: 0; }
  .team li { display: flex; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--line-soft); align-items: flex-start; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center;
    font-weight: 650; font-size: 13px; flex: none;
  }
  .member { flex: 1; min-width: 0; }
  .member .name { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .member .name a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .member .name a:hover { color: var(--accent); text-decoration: underline; }
  .member .headline { color: var(--ink-2); font-size: 12.5px; margin-top: 1px; }

  .meta { margin-top: var(--s5); padding-top: var(--s3); border-top: 1px solid var(--line); color: var(--ink-4); font-size: 12px; }
  .meta .mono { font-family: var(--mono); }

  .empty { padding: var(--s6) var(--s4); color: var(--ink-3); text-align: center; font-size: 13px; }
  .error { padding: var(--s6) var(--s4); color: #B3261E; text-align: center; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Job Leads</h1>
    <p class="sub" id="summary">Loading…</p>
  </div>
  <div class="controls">
    <input type="search" id="search" placeholder="Filter title, company, location, name…" autocomplete="off">
    <select id="sort" aria-label="Sort">
      <option value="degree" selected>Strongest connection</option>
      <option value="company">Company</option>
      <option value="newest">Newest first</option>
      <option value="location">Location</option>
    </select>
  </div>
</header>
<main>
  <section class="list" id="list"></section>
  <section class="detail" id="detail"><div class="empty">Select a lead to see the hiring team</div></section>
</main>
<script>
  const DEGREE_RANK = { "1st": 0, "2nd": 1, "3rd": 2, "": 3 };
  const DEGREES = ["1st", "2nd", "3rd"];
  const DEGREE_TITLE = { "1st": "1st-degree connection", "2nd": "2nd-degree connection", "3rd": "3rd-degree connection" };
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const state = { jobs: [], query: "", sort: "degree", selectedId: null };

  function strongest(job) {
    let best = 3;
    for (const m of job.hiringTeam || []) best = Math.min(best, DEGREE_RANK[m.degree] ?? 3);
    return best >= 3 ? "" : DEGREES[best];
  }
  function matches(job) {
    if (!state.query) return true;
    const q = state.query.toLowerCase();
    const hay = [job.title, job.company, job.location, ...(job.hiringTeam || []).flatMap((m) => [m.name, m.headline])]
      .join(" ").toLowerCase();
    return hay.includes(q);
  }
  function sortJobs(a, b) {
    switch (state.sort) {
      case "degree": {
        const ra = DEGREE_RANK[strongest(a) || ""];
        const rb = DEGREE_RANK[strongest(b) || ""];
        if (ra !== rb) return ra - rb;
        const ta = (a.hiringTeam || []).length, tb = (b.hiringTeam || []).length;
        if (ta !== tb) return tb - ta;
        return a.company.localeCompare(b.company);
      }
      case "company": return a.company.localeCompare(b.company);
      case "newest": return (b.collectedAt || "").localeCompare(a.collectedAt || "");
      case "location": return a.location.localeCompare(b.location);
      default: return 0;
    }
  }
  function visible() { return state.jobs.filter(matches).sort(sortJobs); }

  function badge(deg) {
    if (!deg) return "";
    return `<span class="badge d${deg[0]}" title="${DEGREE_TITLE[deg] || ""}">${esc(deg)}</span>`;
  }

  function renderDescription(text) {
    const connectors = new Set(["of", "the", "and", "in", "for", "to", "with", "a", "an", "on", "at", "&"]);
    const isHeading = (line) => {
      const t = line.trim();
      if (!t || t.length > 48) return false;
      if (/[.,;:|]$/.test(t) || /[•·()]/.test(t)) return false;
      const words = t.split(/\s+/).filter(Boolean);
      return words.length > 0 && words.every((w) => /^[A-Z0-9]/.test(w) || connectors.has(w.toLowerCase()));
    };
    return text.split("\n").filter((l) => l.trim()).map((line) => {
      const t = line.trim();
      return isHeading(t) ? `<div class="desc-heading">${esc(t)}</div>` : `<div>${esc(t)}</div>`;
    }).join("");
  }

  function renderList() {
    const list = el("list");
    const jobs = visible();
    if (!jobs.length) { list.innerHTML = `<div class="empty">No matching leads</div>`; return; }
    list.innerHTML = jobs.map((job) => {
      const sd = strongest(job);
      const teamN = (job.hiringTeam || []).length;
      const side = [sd ? badge(sd) : "", teamN ? `<span class="badge count">${teamN}</span>` : ""].join("");
      const sel = job.id === state.selectedId ? " selected" : "";
      return `<div class="row${sel}" data-id="${esc(job.id)}">
        <div class="row-main">
          <div class="row-company">${esc(job.company || "—")}${job.location ? `<span class="loc"> · ${esc(job.location)}</span>` : ""}</div>
          <div class="row-title">${esc(job.title)}</div>
        </div>
        <div class="row-side">${side}</div>
      </div>`;
    }).join("");
  }

  function renderDetail() {
    const d = el("detail");
    const job = state.jobs.find((j) => j.id === state.selectedId);
    if (!job) { d.innerHTML = `<div class="empty">Select a lead to see the hiring team</div>`; return; }
    const team = job.hiringTeam || [];
    const teamHtml = team.length
      ? `<ul>${team.map((m) => `
          <li>
            <span class="avatar">${esc((m.name || "?").trim().charAt(0).toUpperCase() || "?")}</span>
            <div class="member">
              <div class="name"><a href="${esc(m.profileUrl)}" target="_blank" rel="noopener">${esc(m.name)}</a>${badge(m.degree)}</div>
              ${m.headline ? `<div class="headline">${esc(m.headline)}</div>` : ""}
            </div>
          </li>`).join("")}</ul>`
      : `<div class="empty" style="padding: var(--s4) 0">No hiring team listed on this posting</div>`;
    const facts = [
      job.workplaceType ? `<span class="fact">${esc(job.workplaceType)}</span>` : "",
      job.employmentType ? `<span class="fact">${esc(job.employmentType)}</span>` : "",
      job.applyMethod ? `<span class="fact">${esc(job.applyMethod)}</span>` : "",
      job.promoted ? `<span class="fact flag">Promoted</span>` : "",
      job.activelyReviewing ? `<span class="fact flag">Actively reviewing</span>` : "",
      job.postedAt ? `<span class="fact muted">${esc(job.postedAt)}</span>` : "",
      job.applicantCount ? `<span class="fact muted">${esc(job.applicantCount)}</span>` : "",
    ].filter(Boolean).join("");
    const benefits = job.benefits || [];
    const descHtml = job.description
      ? `<div class="description"><h3>About the job</h3><div class="body">${renderDescription(job.description)}</div></div>`
      : "";
    const benefitsHtml = benefits.length
      ? `<div class="benefits"><h3>Benefits</h3><div class="list">${benefits.map((b) => `<span class="benefit">${esc(b)}</span>`).join("")}</div></div>`
      : "";
    d.innerHTML = `
      <div class="detail-head">
        <span class="status ${esc(job.status)}">${esc(job.status)}</span>
        <h2>${esc(job.title)}</h2>
        <div class="company">${esc(job.company || "—")}</div>
        ${job.location ? `<div class="loc">${esc(job.location)}</div>` : ""}
        ${facts ? `<div class="facts">${facts}</div>` : ""}
        <div><a class="open" href="${esc(job.postingUrl)}" target="_blank" rel="noopener">Open posting ↗</a></div>
      </div>
      <div class="team">
        <h3>Hiring team ${team.length ? `<span class="count">${team.length}</span>` : ""}</h3>
        ${teamHtml}
      </div>
      ${descHtml}
      ${benefitsHtml}
      <div class="meta">ID <span class="mono">${esc(job.id)}</span> · collected ${esc((job.collectedAt || "").slice(0, 10))}</div>`;
  }

  function renderSummary() {
    el("summary").textContent = `${state.jobs.length} leads with hiring team`;
  }

  el("search").addEventListener("input", (e) => { state.query = e.target.value.trim(); renderList(); });
  el("sort").addEventListener("change", (e) => { state.sort = e.target.value; renderList(); });
  el("list").addEventListener("click", (e) => {
    const row = e.target.closest(".row");
    if (!row) return;
    state.selectedId = row.dataset.id;
    renderList(); renderDetail();
  });

  fetch("/jobs.json")
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then((jobs) => {
      state.jobs = Array.isArray(jobs) ? jobs : [];
      state.selectedId = visible()[0]?.id ?? null;
      renderSummary(); renderList(); renderDetail();
    })
    .catch((e) => {
      el("summary").textContent = "Failed to load";
      el("list").innerHTML = `<div class="error">Could not load leads: ${esc(e.message)}</div>`;
    });
</script>
</body>
</html>
